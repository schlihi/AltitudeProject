<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Geoid vs. WGS 84 ellipsoid</title>
  <script type="importmap">
    {
      "imports": {
        "three": "https://cdn.jsdelivr.net/npm/three@0.170.0/build/three.module.js",
        "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.170.0/examples/jsm/"
      }
    }
  </script>
  <style>
    :root { --fg: #e8ecf2; --dim: #9aa3b2; --panel: rgba(16, 20, 28, 0.82); --accent: #f4a582; }
    html, body { margin: 0; height: 100%; overflow: hidden; background: #0b0e14; color: var(--fg);
      font: 14px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
    canvas { display: block; }
    #ui { position: fixed; left: 20px; bottom: 20px; width: 440px; box-sizing: border-box; padding: 16px 18px; border-radius: 10px;
      background: var(--panel); backdrop-filter: blur(6px); box-shadow: 0 6px 24px rgba(0,0,0,.35); }
    h1 { font-size: 15px; margin: 0 0 2px; font-weight: 600; }
    #model { color: var(--dim); font-size: 12px; margin-bottom: 12px; }
    #model.warn { color: #ffb4a2; font-weight: 600; }
    #k-value { font-size: 30px; font-weight: 650; font-variant-numeric: tabular-nums; }
    #k-label { color: var(--dim); font-size: 12px; margin-left: 6px; }
    #k-detail { color: var(--dim); font-size: 12.5px; margin: 2px 0 10px; font-variant-numeric: tabular-nums; }
    #slider { width: 100%; accent-color: var(--accent); }
    .row { display: flex; gap: 6px; flex-wrap: wrap; margin: 6px 0; }
    button { background: #232a36; color: var(--fg); border: 1px solid #343d4c; border-radius: 6px;
      padding: 4px 9px; font: inherit; font-size: 12.5px; cursor: pointer; }
    button:hover { border-color: #56627a; }
    button.on { background: var(--accent); color: #1a1a1a; border-color: var(--accent); }
    #stops { justify-content: space-between; }
    .toggles { display: flex; gap: 12px; font-size: 12.5px; color: var(--dim); margin-top: 8px; }
    .toggles label { white-space: nowrap; display: flex; gap: 5px; align-items: center; cursor: pointer; }
    #legend { margin-top: 12px; }
    #legend-title { font-size: 12px; color: var(--dim); margin-bottom: 4px; }
    #legend-bar { height: 10px; border-radius: 3px; }
    #legend-ticks { position: relative; height: 16px; font-size: 11px; color: var(--dim); font-variant-numeric: tabular-nums; }
    #legend-ticks span { position: absolute; top: 2px; transform: translateX(-50%); }
    #poi-note { font-size: 12.5px; margin-top: 8px; }
    #help { font-size: 11px; color: var(--dim); margin-top: 8px; }
    .poi-label { position: fixed; left: 0; top: 0; pointer-events: none; font-size: 13px; font-weight: 600;
      text-shadow: 0 1px 3px #000, 0 0 6px #000; white-space: nowrap; }
    #status { position: fixed; top: 20px; left: 50%; transform: translateX(-50%); padding: 8px 14px;
      border-radius: 6px; background: var(--panel); font-size: 13px; max-width: 70vw; }
    #status.error { color: #ffb4a2; }
  </style>
</head>
<body>
  <div id="status">Loading…</div>
  <div id="ui">
    <h1>Geoid over the WGS 84 ellipsoid</h1>
    <div id="model"></div>

    <div><span id="k-value">1×</span><span id="k-label">vertical exaggeration</span></div>
    <div id="k-detail"></div>
    <input id="slider" type="range" min="0" max="1" step="0.0005" value="0" aria-label="Vertical exaggeration (log scale)" />
    <div class="row" id="stops"></div>

    <div class="row" id="presets"></div>

    <div class="toggles">
      <label><input type="checkbox" id="t-coast" checked /> Coastlines</label>
      <label><input type="checkbox" id="t-grat" checked /> Ellipsoid grid</label>
      <label><input type="checkbox" id="t-fill" checked /> Ellipsoid shell</label>
      <label><input type="checkbox" id="t-poi" checked /> Labels</label>
    </div>

    <div id="legend">
      <div id="legend-title">Geoid height N above the ellipsoid (m)</div>
      <div id="legend-bar"></div>
      <div id="legend-ticks"></div>
    </div>
    <div id="poi-note"></div>
    <div id="help">Keys: 1–5 exaggeration stops · G/L/H/M camera · U hide panel · drag to rotate, scroll to zoom</div>
  </div>
  <script type="module" src="./main.js"></script>
</body>
</html>
